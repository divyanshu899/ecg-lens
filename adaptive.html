<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Adaptive 12-Lead ECG AR Guide</title>

  <!-- MediaPipe Pose and Camera Engine -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
    }
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Top HUD */
    #topBar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hud-box {
      background: rgba(20, 20, 20, 0.88);
      border: 1px solid #444;
      border-radius: 12px;
      padding: 8px 12px;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .hud-title {
      font-size: 14px;
      font-weight: 700;
      color: #ff9800;
    }
    .hud-sub {
      font-size: 11px;
      color: #aaa;
    }
    .btn-toggle {
      background: #333;
      color: #bbb;
      border: 1px solid #555;
      border-radius: 16px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-toggle.active {
      background: #0288d1;
      color: #fff;
      border-color: #0288d1;
    }

    /* Bottom Control Bar */
    #bottomBar {
      position: absolute;
      bottom: 20px;
      left: 14px;
      right: 14px;
      z-index: 10;
      display: flex;
      gap: 10px;
    }
    .action-btn {
      border: none;
      border-radius: 28px;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 20px;
      cursor: pointer;
    }
    #nextBtn {
      background: #ff9800;
      color: #fff;
      flex-grow: 1;
    }
    #resetBtn {
      background: #2a2a2a;
      color: #eee;
      border: 1px solid #444;
      width: 80px;
    }
  </style>
</head>
<body>

  <div id="stage">
    <div id="topBar">
      <div class="hud-box">
        <div>
          <div class="hud-title" id="leadName">Step 1/10: Lead RA</div>
          <div class="hud-sub" id="leadDesc">Right Infraclavicular Fossa</div>
        </div>
        <div style="display: flex; gap: 4px;">
          <button class="btn-toggle active" id="btnMale" onclick="toggleSex('male')">Male</button>
          <button class="btn-toggle" id="btnFemale" onclick="toggleSex('female')">Female</button>
        </div>
      </div>
    </div>

    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="overlay"></canvas>

    <div id="bottomBar">
      <button class="action-btn" id="resetBtn" onclick="resetLead()">Reset</button>
      <button class="action-btn" id="nextBtn" onclick="nextLead()">Confirm RA</button>
    </div>
  </div>

  <script>
    const LEADS = ["RA", "LA", "RL", "LL", "V1", "V2", "V4", "V3", "V5", "V6"];
    let currentStep = 0;
    let sexMode = "male";

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const leadName = document.getElementById('leadName');
    const leadDesc = document.getElementById('leadDesc');
    const nextBtn = document.getElementById('nextBtn');
    const btnMale = document.getElementById('btnMale');
    const btnFemale = document.getElementById('btnFemale');

    function syncCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', syncCanvas);
    syncCanvas();

    function toggleSex(mode) {
      sexMode = mode;
      if (mode === 'male') {
        btnMale.classList.add('active');
        btnFemale.classList.remove('active');
      } else {
        btnFemale.classList.add('active');
        btnMale.classList.remove('active');
      }
      updateUI();
    }

    function nextLead() {
      if (currentStep < LEADS.length - 1) {
        currentStep++;
      } else if (currentStep === LEADS.length - 1) {
        currentStep++;
      } else {
        currentStep = 0;
      }
      updateUI();
    }

    function resetLead() {
      currentStep = 0;
      updateUI();
    }

    function getLeadText(lead) {
      if (lead === "RA") return "Right Infraclavicular Fossa";
      if (lead === "LA") return "Left Infraclavicular Fossa";
      if (lead === "RL") return "Right Lower Abdomen / Flank";
      if (lead === "LL") return "Left Lower Abdomen / Flank";
      if (lead === "V1") return "4th Intercostal Space, Right Sternal Margin";
      if (lead === "V2") return "4th Intercostal Space, Left Sternal Margin";
      if (lead === "V4") return sexMode === "female" ? "5th ICS at Inframammary Crease" : "5th ICS, Mid-Clavicular Line";
      if (lead === "V3") return "Midway between V2 and V4";
      if (lead === "V5") return "Horizontal with V4, Anterior Axillary Line";
      if (lead === "V6") return "Horizontal with V4, Mid-Axillary Line";
      return "";
    }

    function updateUI() {
      if (currentStep < LEADS.length) {
        const lead = LEADS[currentStep];
        leadName.innerText = `Step ${currentStep + 1}/10: Lead ${lead}`;
        leadDesc.innerText = getLeadText(lead);
        nextBtn.innerText = `Confirm ${lead}`;
        nextBtn.style.background = "#ff9800";
      } else {
        leadName.innerText = "Placement Complete";
        leadDesc.innerText = "All 10 leads verified";
        nextBtn.innerText = "Restart Test";
        nextBtn.style.background = "#4caf50";
      }
    }
    updateUI();

    // Body coordinate tracking
    let landmarks = null;
    function onPoseResults(results) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const w = canvas.width;
      const h = canvas.height;

      let rs, ls, rh, lh;

      if (results && results.poseLandmarks) {
        const lm = results.poseLandmarks;
        rs = { x: lm[11].x * w, y: lm[11].y * h };
        ls = { x: lm[12].x * w, y: lm[12].y * h };
        rh = { x: lm[23].x * w, y: lm[23].y * h };
        lh = { x: lm[24].x * w, y: lm[24].y * h };
      } else {
        // Fallback anatomical frame if person is positioning
        rs = { x: w * 0.30, y: h * 0.28 };
        ls = { x: w * 0.70, y: h * 0.28 };
        rh = { x: w * 0.35, y: h * 0.75 };
        lh = { x: w * 0.65, y: h * 0.75 };
      }

      const shoulderWidth = Math.hypot(ls.x - rs.x, ls.y - rs.y) || 1;
      const uNorm = { x: (ls.x - rs.x) / shoulderWidth, y: (ls.y - rs.y) / shoulderWidth };

      const sternalNotch = { x: (rs.x + ls.x) / 2, y: (rs.y + ls.y) / 2 };
      const pelvicCenter = { x: (rh.x + lh.x) / 2, y: (rh.y + lh.y) / 2 };

      const torsoHeight = Math.hypot(pelvicCenter.x - sternalNotch.x, pelvicCenter.y - sternalNotch.y) || 1;
      const vNorm = { x: (pelvicCenter.x - sternalNotch.x) / torsoHeight, y: (pelvicCenter.y - sternalNotch.y) / torsoHeight };

      function getPt(u, v) {
        return {
          x: sternalNotch.x + (uNorm.x * u * shoulderWidth) + (vNorm.x * v * torsoHeight),
          y: sternalNotch.y + (uNorm.y * u * shoulderWidth) + (vNorm.y * v * torsoHeight)
        };
      }

      const v4Long = sexMode === "female" ? 0.49 : 0.43;
      const v4Lat = sexMode === "female" ? 0.30 : 0.28;

      const targets = {
        "RA": getPt(-0.42, 0.08),
        "LA": getPt(0.42, 0.08),
        "RL": getPt(-0.25, 0.90),
        "LL": getPt(0.25, 0.90),
        "V1": getPt(-0.12, 0.32),
        "V2": getPt(0.12, 0.32),
        "V4": getPt(v4Lat, v4Long)
      };

      targets["V3"] = {
        x: (targets["V2"].x + targets["V4"].x) / 2,
        y: (targets["V2"].y + targets["V4"].y) / 2
      };

      targets["V5"] = getPt(v4Lat + 0.16, v4Long);
      targets["V6"] = getPt(v4Lat + 0.31, v4Long);

      // Render leads
      LEADS.forEach((lead, idx) => {
        const pt = targets[lead];
        if (!pt) return;

        if (idx < currentStep) {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 8, 0, 2 * Math.PI);
          ctx.fillStyle = '#4caf50';
          ctx.fill();

          ctx.fillStyle = '#4caf50';
          ctx.font = 'bold 12px sans-serif';
          ctx.fillText(`${lead} ✓`, pt.x + 12, pt.y + 4);
        } else if (idx === currentStep) {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 18, 0, 2 * Math.PI);
          ctx.strokeStyle = '#ff9800';
          ctx.lineWidth = 3;
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 8, 0, 2 * Math.PI);
          ctx.fillStyle = '#ffeb3b';
          ctx.fill();

          ctx.fillStyle = '#ffeb3b';
          ctx.font = 'bold 13px sans-serif';
          ctx.fillText(`PLACE ${lead}`, pt.x + 22, pt.y + 5);
        } else {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 5, 0, 2 * Math.PI);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
          ctx.fill();

          ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.font = '11px sans-serif';
          ctx.fillText(lead, pt.x + 8, pt.y + 4);
        }
      });
    }

    // Direct, reliable camera bootstrap
    window.addEventListener('load', () => {
      if (typeof Pose === 'undefined' || typeof Camera === 'undefined') {
        // Fallback animation loop if CDN is blocked/slow
        setInterval(() => onPoseResults(null), 100);
        return;
      }

      const pose = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
      });

      pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      pose.onResults(onPoseResults);

      const camera = new Camera(video, {
        onFrame: async () => {
          await pose.send({ image: video });
        },
        facingMode: "environment",
        width: 640,
        height: 480
      });
      camera.start().catch((err) => {
        console.warn("Camera fallback active:", err);
        setInterval(() => onPoseResults(null), 100);
      });
    });
  </script>
</body>
</html>
