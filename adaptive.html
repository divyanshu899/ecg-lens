<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Adaptive 12-Lead ECG AR Guide</title>

  <!-- MediaPipe Pose and Camera Engine -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
    }

    /* Initial Setup Modal */
    #patientModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100%;
      height: 100dvh;
      background: rgba(10, 10, 10, 0.96);
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding: 16px 12px;
      overflow-y: auto;
      box-sizing: border-box;
      -webkit-overflow-scrolling: touch;
    }
    .modal-card {
      background: #181818;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 18px 16px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      text-align: center;
      margin: auto 0;
      box-sizing: border-box;
    }
    .modal-title {
      font-size: 19px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }
    .modal-desc {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .modal-label {
      font-size: 12px;
      font-weight: 600;
      color: #ff9800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      text-align: left;
    }
    .sex-select-row {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .sex-card-btn {
      flex: 1;
      background: #252525;
      border: 2px solid #3a3a3a;
      border-radius: 12px;
      padding: 16px 8px;
      color: #ddd;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .sex-card-btn.selected {
      border-color: #0288d1;
      background: rgba(2, 136, 209, 0.18);
      color: #fff;
    }
    .sex-card-btn span.subtext {
      font-size: 11px;
      font-weight: normal;
      color: #888;
    }
    .sex-card-btn.selected span.subtext {
      color: #81d4fa;
    }
    .modal-select {
      width: 100%;
      background: #252525;
      color: #fff;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      margin-bottom: 24px;
      outline: none;
      box-sizing: border-box;
    }
    .start-btn {
      width: 100%;
      background: #ff9800;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      padding: 14px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 152, 0, 0.35);
    }

    /* Top HUD */
    #topControls {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hud-card {
      background: rgba(18, 18, 19, 0.90);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 8px 12px;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .hud-title {
      font-size: 13px;
      font-weight: 700;
      color: #ff9800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .hud-subtitle {
      font-size: 11px;
      color: #aaa;
      margin-top: 2px;
    }
    .pill-group {
      display: flex;
      background: #222;
      border-radius: 20px;
      padding: 2px;
      border: 1px solid #444;
    }
    .pill-btn {
      background: transparent;
      border: none;
      color: #888;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 16px;
      cursor: pointer;
    }
    .pill-btn.active {
      background: #0288d1;
      color: #fff;
    }
    .habitus-bar {
      background: rgba(18, 18, 18, 0.90);
      border: 1px solid #333;
      border-radius: 10px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ccc;
      font-size: 11px;
    }
    .habitus-bar select {
      background: #252525;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      outline: none;
    }

    /* Bottom Buttons */
    #bottomBar {
      position: absolute;
      bottom: 20px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      gap: 12px;
    }
    .btn {
      border: none;
      border-radius: 28px;
      font-size: 15px;
      font-weight: 700;
      padding: 13px 20px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }
    #nextBtn {
      background: #ff9800;
      color: #fff;
      flex-grow: 1;
    }
    #resetBtn {
      background: #333;
      color: #eee;
      width: 85px;
    }
  </style>
</head>
<body>

  <!-- Clinical Intake Screen -->
  <div id="patientModal">
    <div class="modal-card">
      <div class="modal-title">Patient Calibration</div>
      <div class="modal-desc">Select anatomical profile for lead trajectory and intercostal spacing.</div>

      <div class="modal-label">Biological Profile</div>
      <div class="sex-select-row">
        <button type="button" class="sex-card-btn selected" id="optMale" onclick="selectInitialSex('male')">
          Male
          <span class="subtext">Standard 4th/5th ICS</span>
        </button>
        <button type="button" class="sex-card-btn" id="optFemale" onclick="selectInitialSex('female')">
          Female
          <span class="subtext">Inframammary Fold</span>
        </button>
      </div>

      <div class="modal-label">Body Build / Habitus</div>
      <select class="modal-select" id="initialBodySize">
        <option value="slim">Slim / Pediatric (Narrow Chest)</option>
        <option value="standard" selected>Standard Adult</option>
        <option value="broad">Athletic / Broad Thorax</option>
        <option value="heavy">High BMI / Expanded Thorax</option>
      </select>

      <button type="button" class="start-btn" onclick="startARGuide()">Start AR Placement</button>
    </div>
  </div>

  <!-- AR Workspace -->
  <div id="stage">
    <div id="topControls">
      <div class="hud-card">
        <div>
          <div class="hud-title" id="hudLead">Tracking Patient...</div>
          <div class="hud-subtitle" id="hudDetail">Center camera on shoulders & chest</div>
        </div>
        <div class="pill-group">
          <button class="pill-btn active" id="btnMale" onclick="setSex('male')">Male</button>
          <button class="pill-btn" id="btnFemale" onclick="setSex('female')">Female</button>
        </div>
      </div>

      <div class="habitus-bar">
        <span>Body Size:</span>
        <select id="bodySize" onchange="updateHabitus(this.value)">
          <option value="slim">Slim / Pediatric</option>
          <option value="standard" selected>Standard Adult</option>
          <option value="broad">Athletic / Broad Chest</option>
          <option value="heavy">High BMI / Obese</option>
        </select>
        <span id="statusIndicator" style="margin-left: auto; color: #ff5722;">Searching...</span>
      </div>
    </div>

    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="overlay"></canvas>

    <div id="bottomBar">
      <button class="btn" id="resetBtn" onclick="resetPlacement()">Reset</button>
      <button class="btn" id="nextBtn" onclick="advanceLead()">Confirm RA</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const hudLead = document.getElementById('hudLead');
    const hudDetail = document.getElementById('hudDetail');
    const nextBtn = document.getElementById('nextBtn');
    const btnMale = document.getElementById('btnMale');
    const btnFemale = document.getElementById('btnFemale');
    const optMale = document.getElementById('optMale');
    const optFemale = document.getElementById('optFemale');
    const patientModal = document.getElementById('patientModal');
    const bodySizeSelect = document.getElementById('bodySize');
    const initialBodySize = document.getElementById('initialBodySize');
    const statusIndicator = document.getElementById('statusIndicator');

    const LEADS = ["RA", "LA", "RL", "LL", "V1", "V2", "V4", "V3", "V5", "V6"];
    let currentStep = 0;
    let patientSex = "male";

    // Habitus scaling factors
    let habitusConfig = {
      lateralSpread: 1.0,
      torsoDepthRatio: 1.0,
      sternalGap: 0.12
    };

    function selectInitialSex(sex) {
      patientSex = sex;
      if (sex === 'male') {
        optMale.classList.add('selected');
        optFemale.classList.remove('selected');
      } else {
        optFemale.classList.add('selected');
        optMale.classList.remove('selected');
      }
    }

    function startARGuide() {
      const selectedSize = initialBodySize.value;
      bodySizeSelect.value = selectedSize;
      updateHabitus(selectedSize);
      setSex(patientSex);

      // Hide modal and start camera engine
      patientModal.style.display = 'none';
      initVisionEngine();
    }

    function updateHabitus(size) {
      if (size === 'slim') {
        habitusConfig = { lateralSpread: 0.85, torsoDepthRatio: 0.92, sternalGap: 0.09 };
      } else if (size === 'broad') {
        habitusConfig = { lateralSpread: 1.15, torsoDepthRatio: 1.05, sternalGap: 0.14 };
      } else if (size === 'heavy') {
        habitusConfig = { lateralSpread: 1.30, torsoDepthRatio: 1.15, sternalGap: 0.16 };
      } else {
        habitusConfig = { lateralSpread: 1.0, torsoDepthRatio: 1.0, sternalGap: 0.12 };
      }
    }

    // Smoothed body landmarks
    const smoothed = {
      rShoulder: null,
      lShoulder: null,
      rHip: null,
      lHip: null
    };
    const ALPHA = 0.25;

    function setSex(sex) {
      patientSex = sex;
      if (sex === 'male') {
        btnMale.classList.add('active');
        btnFemale.classList.remove('active');
      } else {
        btnFemale.classList.add('active');
        btnMale.classList.remove('active');
      }
      updateHUD();
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function advanceLead() {
      if (currentStep < LEADS.length) {
        currentStep++;
        updateHUD();
      }
    }

    function resetPlacement() {
      currentStep = 0;
      updateHUD();
    }

    function updateHUD() {
      if (currentStep < LEADS.length) {
        const lead = LEADS[currentStep];
        let note = "";
        if (lead === "V1") note = "4th ICS, Right Sternal Margin";
        else if (lead === "V2") note = "4th ICS, Left Sternal Margin";
        else if (lead === "V4") note = patientSex === "female" ? "5th ICS at Inframammary Crease" : "5th ICS, Mid-Clavicular Line";
        else if (lead === "V3") note = "Halfway between V2 and V4";
        else if (lead === "V5") note = "Horizontal with V4, Anterior Axillary Line";
        else if (lead === "V6") note = "Horizontal with V4, Mid-Axillary Line";
        else if (lead === "RA") note = "Right Infraclavicular Fossa";
        else if (lead === "LA") note = "Left Infraclavicular Fossa";
        else if (lead === "RL") note = "Right Lower Abdomen / Flank";
        else if (lead === "LL") note = "Left Lower Abdomen / Flank";

        hudLead.innerText = `Step ${currentStep + 1}/10: Lead ${lead}`;
        hudDetail.innerText = note;
        nextBtn.innerText = `Confirm ${lead}`;
        nextBtn.style.background = "#ff9800";
      } else {
        hudLead.innerText = "Placement Verified";
        hudDetail.innerText = "All 10 electrodes adapted to body metrics";
        nextBtn.innerText = "Restart Test";
        nextBtn.style.background = "#4caf50";
      }
    }
    updateHUD();

    function smoothPt(prev, target) {
      if (!prev) return { x: target.x, y: target.y };
      return {
        x: ALPHA * target.x + (1 - ALPHA) * prev.x,
        y: ALPHA * target.y + (1 - ALPHA) * prev.y
      };
    }

    function initVisionEngine() {
      const pose = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
      });

      pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      pose.onResults(onPoseResults);

      const camera = new Camera(video, {
        onFrame: async () => {
          await pose.send({ image: video });
        },
        facingMode: "environment",
        width: 640,
        height: 480
      });
      camera.start();
    }

    function onPoseResults(results) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const w = canvas.width;
      const h = canvas.height;

      let rs, ls, rh, lh;

      if (results.poseLandmarks) {
        statusIndicator.innerText = "Locked";
        statusIndicator.style.color = "#4caf50";

        const lm = results.poseLandmarks;
        const rawRS = { x: lm[11].x * w, y: lm[11].y * h };
        const rawLS = { x: lm[12].x * w, y: lm[12].y * h };
        const rawRH = { x: lm[23].x * w, y: lm[23].y * h };
        const rawLH = { x: lm[24].x * w, y: lm[24].y * h };

        smoothed.rShoulder = smoothPt(smoothed.rShoulder, rawRS);
        smoothed.lShoulder = smoothPt(smoothed.lShoulder, rawLS);
        smoothed.rHip = smoothPt(smoothed.rHip, rawRH);
        smoothed.lHip = smoothPt(smoothed.lHip, rawLH);

        rs = smoothed.rShoulder;
        ls = smoothed.lShoulder;
        rh = smoothed.rHip;
        lh = smoothed.lHip;
      } else {
        statusIndicator.innerText = "Estimating...";
        statusIndicator.style.color = "#ff9800";

        rs = { x: w * 0.28, y: h * 0.26 };
        ls = { x: w * 0.72, y: h * 0.26 };
        rh = { x: w * 0.32, y: h * 0.72 };
        lh = { x: w * 0.68, y: h * 0.72 };
      }

      // Clavicular Vector: U (horizontal across chest)
      const uVec = { x: ls.x - rs.x, y: ls.y - rs.y };
      const shoulderWidth = Math.hypot(uVec.x, uVec.y);
      const uNorm = { x: uVec.x / shoulderWidth, y: uVec.y / shoulderWidth };

      // Sternal Midpoint
      const sternalNotch = { x: (rs.x + ls.x) / 2, y: (rs.y + ls.y) / 2 };

      // Pelvic Midpoint
      const pelvicCenter = { x: (rh.x + lh.x) / 2, y: (rh.y + lh.y) / 2 };

      // Torso Vector: V (longitudinal spinal axis)
      const vVec = { x: pelvicCenter.x - sternalNotch.x, y: pelvicCenter.y - sternalNotch.y };
      const torsoHeight = Math.hypot(vVec.x, vVec.y) * habitusConfig.torsoDepthRatio;
      const vNorm = { x: vVec.x / (torsoHeight || 1), y: vVec.y / (torsoHeight || 1) };

      function getBodyPoint(uOffset, vOffset) {
        return {
          x: sternalNotch.x + (uNorm.x * uOffset * shoulderWidth) + (vNorm.x * vOffset * torsoHeight),
          y: sternalNotch.y + (uNorm.y * uOffset * shoulderWidth) + (vNorm.y * vOffset * torsoHeight)
        };
      }

      const spread = habitusConfig.lateralSpread;
      const v4Longitudinal = patientSex === "female" ? 0.49 : 0.43;
      const v4Lateral = (0.28 * spread) * (patientSex === "female" ? 1.08 : 1.0);

      const targets = {
        "RA": getBodyPoint(-0.42, 0.08),
        "LA": getBodyPoint(0.42, 0.08),
        "RL": getBodyPoint(-0.25, 0.90),
        "LL": getBodyPoint(0.25, 0.90),

        "V1": getBodyPoint(-habitusConfig.sternalGap, 0.32),
        "V2": getBodyPoint(habitusConfig.sternalGap, 0.32),
        "V4": getBodyPoint(v4Lateral, v4Longitudinal)
      };

      targets["V3"] = {
        x: (targets["V2"].x + targets["V4"].x) / 2,
        y: (targets["V2"].y + targets["V4"].y) / 2
      };

      targets["V5"] = getBodyPoint(v4Lateral + (0.16 * spread), v4Longitudinal);
      targets["V6"] = getBodyPoint(v4Lateral + (0.31 * spread), v4Longitudinal);

      // Anatomical reference skeleton
      ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(rs.x, rs.y);
      ctx.lineTo(ls.x, ls.y);
      ctx.moveTo(sternalNotch.x, sternalNotch.y);
      ctx.lineTo(pelvicCenter.x, pelvicCenter.y);
      ctx.stroke();

      // Render Electrodes
      LEADS.forEach((name, idx) => {
        const pt = targets[name];

        if (idx < currentStep) {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 8, 0, 2 * Math.PI);
          ctx.fillStyle = '#4caf50';
          ctx.fill();
          ctx.fillStyle = '#4caf50';
          ctx.font = 'bold 12px Arial';
          ctx.fillText(`${name} ✓`, pt.x + 12, pt.y + 4);
        } else if (idx === currentStep) {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 18, 0, 2 * Math.PI);
          ctx.strokeStyle = '#ff9800';
          ctx.lineWidth = 3;
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 8, 0, 2 * Math.PI);
          ctx.fillStyle = '#ffeb3b';
          ctx.fill();

          ctx.fillStyle = '#ffeb3b';
          ctx.font = 'bold 14px Arial';
          ctx.fillText(`PLACE ${name}`, pt.x + 22, pt.y + 5);
        } else {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 5, 0, 2 * Math.PI);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
          ctx.fill();

          ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.font = '11px Arial';
          ctx.fillText(name, pt.x + 8, pt.y + 4);
        }
      });
    }
  </script>
</body>
</html>
