<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dynamic ECG AR Placement Guide</title>

  <!-- Real-time MediaPipe Vision libraries via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
    }
    #topBar {
      position: absolute;
      top: 15px;
      left: 10px;
      right: 10px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    #hud {
      flex-grow: 1;
      background: rgba(15, 15, 15, 0.85);
      border-radius: 8px;
      padding: 10px;
      color: #ff9800;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      border: 1px solid #444;
    }
    #btnContainer {
      position: absolute;
      bottom: 25px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      padding: 0 20px;
      z-index: 10;
    }
    button.action {
      padding: 14px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      border: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    #nextBtn {
      background: #ff9800;
      color: #fff;
      flex-grow: 1;
      margin-left: 10px;
    }
    #resetBtn {
      background: #444;
      color: #ddd;
      width: 80px;
    }
  </style>
</head>
<body>

  <div id="container">
    <div id="topBar">
      <div id="hud">Detecting Body...</div>
    </div>

    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="overlay"></canvas>

    <div id="btnContainer">
      <button class="action" id="resetBtn" onclick="resetSteps()">Reset</button>
      <button class="action" id="nextBtn" onclick="nextStep()">Confirm Lead</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');
    const nextBtn = document.getElementById('nextBtn');

    const LEADS = ["RA", "LA", "RL", "LL", "V1", "V2", "V4", "V3", "V5", "V6"];
    let currentStep = 0;

    // Smoothing state
    let smoothX = null, smoothY = null, smoothScale = null;
    const ALPHA = 0.25;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function nextStep() {
      if (currentStep < LEADS.length) {
        currentStep++;
        updateHUD();
      }
    }

    function resetSteps() {
      currentStep = 0;
      updateHUD();
    }

    function updateHUD() {
      if (currentStep < LEADS.length) {
        const lead = LEADS[currentStep];
        const side = (lead === "RA" || lead === "RL" || lead === "V1") ? "(Patient's RIGHT)" : "(Patient's LEFT)";
        hud.innerHTML = `Step ${currentStep + 1}/10: <b>${lead}</b> ${side}`;
        hud.style.color = "#ff9800";
        nextBtn.innerText = `Confirm ${lead}`;
      } else {
        hud.innerHTML = "<b>All 10 Electrodes Positioned!</b>";
        hud.style.color = "#4caf50";
        nextBtn.innerText = "Complete";
      }
    }
    updateHUD();

    // Initialize MediaPipe Face Detection
    const faceDetection = new FaceDetection({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
    });

    faceDetection.setOptions({
      model: 'short',
      minDetectionConfidence: 0.5
    });

    faceDetection.onResults(onResults);

    const camera = new Camera(video, {
      onFrame: async () => {
        await faceDetection.send({ image: video });
      },
      facingMode: "environment",
      width: 640,
      height: 480
    });
    camera.start();

    function onResults(results) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const w = canvas.width;
      const h = canvas.height;

      let rawX, rawY, rawScale;

      if (results.detections && results.detections.length > 0) {
        const bbox = results.detections[0].boundingBox;
        const faceX = bbox.xCenter * w;
        const faceY = bbox.yCenter * h;
        const faceW = bbox.width * w;
        const faceH = bbox.height * h;

        // Dynamic torso projection anchored to detected face
        rawScale = faceW * 2.2;
        rawX = faceX;
        rawY = faceY + faceH * 0.95;
      } else {
        rawX = w / 2;
        rawY = h * 0.40;
        rawScale = w * 0.38;
      }

      // Smooth out camera shake
      if (smoothX === null) {
        smoothX = rawX;
        smoothY = rawY;
        smoothScale = rawScale;
      } else {
        smoothX = ALPHA * rawX + (1 - ALPHA) * smoothX;
        smoothY = ALPHA * rawY + (1 - ALPHA) * smoothY;
        smoothScale = ALPHA * rawScale + (1 - ALPHA) * smoothScale;
      }

      const sternumX = smoothX;
      const refY = smoothY + smoothScale * 0.35;
      const scale = smoothScale;

      // Patient Right = Screen Left | Patient Left = Screen Right
      const targets = {
        "RA": { x: sternumX - scale * 0.85, y: refY + scale * 0.40 },
        "RL": { x: sternumX - scale * 0.45, y: refY + scale * 0.90 },
        "V1": { x: sternumX - scale * 0.16, y: refY },

        "LA": { x: sternumX + scale * 0.85, y: refY + scale * 0.40 },
        "LL": { x: sternumX + scale * 0.45, y: refY + scale * 0.90 },
        "V2": { x: sternumX + scale * 0.16, y: refY },
        "V4": { x: sternumX + scale * 0.42, y: refY + scale * 0.22 },
      };

      targets["V3"] = { x: (targets["V2"].x + targets["V4"].x) / 2, y: (targets["V2"].y + targets["V4"].y) / 2 };
      targets["V5"] = { x: targets["V4"].x + scale * 0.18, y: targets["V4"].y };
      targets["V6"] = { x: targets["V5"].x + scale * 0.16, y: targets["V4"].y };

      // Render Leads
      LEADS.forEach((name, index) => {
        const pt = targets[name];

        if (index < currentStep) {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 8, 0, 2 * Math.PI);
          ctx.fillStyle = '#4caf50';
          ctx.fill();
          ctx.fillStyle = '#4caf50';
          ctx.font = '12px Arial';
          ctx.fillText(`${name} ✓`, pt.x + 12, pt.y + 4);
        } else if (index === currentStep) {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 16, 0, 2 * Math.PI);
          ctx.strokeStyle = '#ff9800';
          ctx.lineWidth = 3;
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 8, 0, 2 * Math.PI);
          ctx.fillStyle = '#ffeb3b';
          ctx.fill();

          ctx.fillStyle = '#ffeb3b';
          ctx.font = 'bold 15px Arial';
          ctx.fillText(`PLACE ${name}`, pt.x + 20, pt.y + 5);
        } else {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 5, 0, 2 * Math.PI);
          ctx.fillStyle = 'rgba(255,255,255,0.4)';
          ctx.fill();

          ctx.fillStyle = 'rgba(255,255,255,0.5)';
          ctx.font = '11px Arial';
          ctx.fillText(name, pt.x + 8, pt.y + 4);
        }
      });
    }
  </script>
</body>
</html>
